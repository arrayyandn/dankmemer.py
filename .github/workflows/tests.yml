name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev,sqlite,postgres]"
      - run: python -m pytest -q -p no:cacheprovider

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dankmemer_tests
          POSTGRES_PASSWORD: tests
          POSTGRES_DB: dankmemer_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dankmemer_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DANKMEMER_TEST_POSTGRES_DSN: postgresql://dankmemer_tests:tests@127.0.0.1:5432/dankmemer_tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev,sqlite,postgres]"
      - run: python -m pytest -q -p no:cacheprovider

  minimum-dependencies:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -c tests/minimum-dependencies.txt ".[dev,sqlite,postgres]"
      - run: python -m pytest -q -p no:cacheprovider

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e ".[dev,docs,sqlite,postgres]" build twine
      - run: .venv/bin/python -m pyright
      - run: .venv/bin/python -m mypy --no-incremental
      - run: .venv/bin/python -m ruff check --no-cache dankmemer tests examples docs/conf.py
      - run: .venv/bin/python -m ruff format --check --no-cache dankmemer tests examples docs/conf.py
      - run: .venv/bin/python -m sphinx -W --keep-going -b html docs docs/_build/html
      - run: .venv/bin/python -m build
      - run: .venv/bin/python -m twine check dist/*

      - name: Check installed wheel imports
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/dankmemer-install"
          python_bin="$RUNNER_TEMP/dankmemer-install/bin/python"
          wheel=("$GITHUB_WORKSPACE"/dist/*.whl)
          "$python_bin" -m pip install "${wheel[0]}"
          "$python_bin" -I -c 'from dankmemer import DankMemer; from importlib.resources import files; assert files("dankmemer").joinpath("py.typed").is_file()'
          "$python_bin" -m pip install "dankmemer.py[discord,sqlite,postgres] @ file://${wheel[0]}"
          "$python_bin" -I -c 'import dankmemer.ext.dpy; import dankmemer.storage.sqlite; import dankmemer.storage.postgres'
          "$python_bin" -m pip check
